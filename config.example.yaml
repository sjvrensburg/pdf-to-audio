# Example configuration file for pdf-to-audio
# This file demonstrates all available configuration options

# LLM settings (provider-agnostic)
llm:
  # Temperature parameter for randomness in responses (0.0-1.0)
  temperature: 0.2
  
  # Core text transformation
  transform_provider: "mistral"        # Provider: mistral, openai, anthropic, zai
  transform_model: "mistral-small-latest"
  
  # Math expression handling
  math_provider: "mistral"             # Provider: mistral, openai, anthropic, zai
  math_model: "mistral-small-latest"
  
  # Citations and references
  citations_provider: "mistral"        # Provider: mistral, openai, anthropic, zai
  citations_model: "mistral-small-latest"
  
  # Language and style refinement
  language_provider: "mistral"         # Provider: mistral, openai, anthropic, zai
  language_model: "mistral-small-latest"
  
  # Max tokens for LLM responses
  max_tokens: 4000

# Image model settings (still Mistral-specific for now)
image:
  image_model: "pixtral-12b-latest"

# Example: Using OpenAI for all stages
# llm:
#   transform_provider: "openai"
#   transform_model: "gpt-3.5-turbo"
#   math_provider: "openai"
#   math_model: "gpt-3.5-turbo"
#   citations_provider: "openai"
#   citations_model: "gpt-3.5-turbo"
#   language_provider: "openai"
#   language_model: "gpt-3.5-turbo"

# Example: Mixed providers (OpenAI for text, Mistral for math)
# llm:
#   transform_provider: "openai"
#   transform_model: "gpt-3.5-turbo"
#   math_provider: "mistral"
#   math_model: "mistral-small-latest"
#   citations_provider: "openai"
#   citations_model: "gpt-3.5-turbo"
#   language_provider: "mistral"
#   language_model: "mistral-large-latest"

# Text-to-Speech settings
tts:
  # TTS exaggeration level (0.0-1.0)
  exaggeration: 0.5
  
  # CFG weight for TTS (0.0-1.0)
  cfg_weight: 0.5
  
  # TTS exaggeration level for mathematical content (0.0-1.0)
  # If not provided, defaults to math_tts_scale * exaggeration
  # math_exaggeration: 0.375
  
  # CFG weight for TTS for mathematical content (0.0-1.0)
  # If not provided, defaults to math_tts_scale * cfg_weight
  # math_cfg_weight: 0.375
  
  # Scaling factor for math TTS settings relative to plain text settings
  math_tts_scale: 0.75
  
  # Output audio format (wav, mp3, flac, ogg, m4a)
  audio_format: "wav"
  
  # Text chunking strategy for audio generation (duration, sentences, smart)
  chunk_strategy: "smart"
  
  # Apply global volume normalization to the entire audio file after concatenation
  global_normalization: false
  
  # Path to a reference audio file for voice cloning (WAV, MP3, FLAC, M4A)
  # audio_prompt_path: "/path/to/reference_voice.wav"

# General settings
general:
  # Directory to use for temporary files
  # If not provided, system temp directory will be used
  # temp_dir: "/path/to/temp/dir"
  
  # Number of pages to process at a time
  pages_per_chunk: 1
  
  # Include image descriptions in the output
  include_images: false
  
  # Overwrite output files if they exist
  overwrite: false
  
  # Enable verbose output for debugging
  verbose: false

  # Force using CPU for TTS even if GPU is available
  force_cpu: false

  # Enable/disable specific LLM processing stages
  enable_math_refinement: true
  enable_citations_refinement: true
  enable_language_refinement: true