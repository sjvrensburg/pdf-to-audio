[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-to-audio"
version = "0.1.1"
description = "A tool to convert PDFs to TTS-friendly text using Mistral API"
authors = [
    {name = "sjvrensburg", email = "stefanj@mandela.ac.za"}
]
license = {text = "GPL-3.0-or-later"}
readme = "README.md"
requires-python = ">=3.8"
keywords = ["pdf", "audio", "tts", "text-to-speech", "mistral", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "requests>=2.32.4",
    "mistralai>=1.9.1",
    "tenacity>=9.1.2",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.4.1",
    "isort>=5.0.0",
    "ruff>=0.12.2",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
interactive = [
    "ipython>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/sjvrensburg/pdf-to-audio"
Repository = "https://github.com/sjvrensburg/pdf-to-audio"
Issues = "https://github.com/sjvrensburg/pdf-to-audio/issues"

[project.scripts]
pdf-to-audio = "pdf_to_audio.cli:main"
