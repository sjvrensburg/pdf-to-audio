[project]
name = "pdf-to-audio"
version = "0.1.0"
description = "A tool to convert PDFs to audio files"
authors = [
    {name = "sjvrensburg",email = "stefanj@mandela.ac.za"}
]
license = {text = "GPL3"}
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "requests (>=2.32.4,<3.0.0)",
    "rich (>=14.0.0,<15.0.0)",
    "mistune (>=3.1.3,<4.0.0)",
    "pydub (>=0.25.1,<0.26.0)",
    "mistralai (>=1.9.1,<2.0.0)",
    "tenacity (>=9.1.2,<10.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
]

[tool.poetry.group.interactive]
optional = true

[tool.poetry.group.interactive.dependencies]
ipython = "^9.4.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
mypy = "^1.4.1"
isort = "^6.0.1"
ruff = "^0.12.2"
pylance = "^0.31.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.scripts]
pdf-to-audio = "pdf_to_audio:main"


[tool.poetry.dependencies]
